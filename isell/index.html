    ${accountHTML()}
    ${isAdmin()?teamHTML():''}
    <section class="sec">${'<h3>Business details</h3>'}<div class="grid2">
      ${sf('Business name','company.name',SD.company.name,{full:true})}
      ${sf('Address (one line per row)','company.address',SD.company.address,{area:true,full:true})}
      ${sf('Email','company.email',SD.company.email)}${sf('Phone numbers','company.phones',SD.company.phones)}
      ${sf('TPIN (optional)','company.tpin',SD.company.tpin)}${sf('Currency','currency',SD.currency)}
      ${sf('Thank-you line','thanks',SD.thanks,{full:true})}</div></section>
    <section class="sec"><h3>Bank and mobile money</h3><div class="grid2">
      ${sf('Bank name','bank.bank',SD.bank.bank)}${sf('Account name (optional)','bank.accountName',SD.bank.accountName)}
      ${sf('Account number','bank.account',SD.bank.account)}${sf('Branch','bank.branch',SD.bank.branch)}
      ${sf('Branch code','bank.branchCode',SD.bank.branchCode)}${sf('Swift code','bank.swift',SD.bank.swift)}
      ${sf('Mobile banking providers','mobile.providers',SD.mobile.providers)}${sf('Mobile banking number','mobile.number',SD.mobile.number)}</div></section>
    <section class="sec"><h3>Numbers, dates and tax</h3><div class="grid3">
      ${sf('Quotation prefix','numbering.quote.prefix',nb.quote.prefix)}${sf('Invoice prefix','numbering.invoice.prefix',nb.invoice.prefix)}${sf('Receipt prefix','numbering.receipt.prefix',nb.receipt.prefix)}
      ${sf('First quotation no.','numbering.quote.start',nb.quote.start,{num:true,type:'number'})}${sf('First invoice no.','numbering.invoice.start',nb.invoice.start,{num:true,type:'number'})}${sf('First receipt no.','numbering.receipt.start',nb.receipt.start,{num:true,type:'number'})}
      ${sf('Quotes valid for (days)','validDays',SD.validDays,{num:true,type:'number'})}${sf('Invoices due in (days)','dueDays',SD.dueDays,{num:true,type:'number'})}<div></div>
      ${sf('Tax name','tax.label',SD.tax.label)}${sf('Default tax rate (%)','tax.rate',SD.tax.rate,{num:true,type:'number'})}</div>
      <p class="hint" style="margin:10px 0 0">Numbers continue from the highest number already used, so they never repeat.</p></section>
    <section class="sec"><h3>Default terms</h3><div class="grid2">
      ${sf('Quotations','terms.quote',SD.terms.quote,{area:true,full:true})}
      ${sf('Invoices','terms.invoice',SD.terms.invoice,{area:true,full:true})}
      ${sf('Receipts','terms.receipt',SD.terms.receipt,{area:true,full:true})}</div></section>
    <section class="sec wide"><h3>Staff and signatures</h3><div class="staff" id="staff">${staffHTML()}</div>
      <p class="hint">These names and signatures print on documents. To let someone sign in, add them under Team logins.</p>
      <div style="margin-top:10px"><button class="btn small" id="addStaff">+ Add staff member</button></div></section>
    ${isAdmin()?`<section class="sec wide"><h3>Backup</h3><p class="hint" style="margin:0 0 10px">Download a copy of every record and setting. Keep it somewhere safe, like Google Drive. Do this every week.</p><button class="btn small" id="doBackup">Download backup</button></section>`:''}
  </div>`;
}
function accountHTML(){
  return `<section class="sec"><h3>My account</h3>
    <p class="hint" style="margin:0 0 10px">Signed in as <b>${esc(ME.email)}</b></p>
    <div class="grid2">${pwField('my_pw','New password','new-password')}${pwField('my_pw2','Type it again','new-password')}</div>
    <div style="margin-top:10px"><button class="btn small" id="changePw">Change my password</button></div></section>`;
}
let TEAM = null;
function teamHTML(){
  if(TEAM===null){ loadTeam(); }
  return `<section class="sec"><h3>Team logins</h3>
    <div class="team" id="team">${teamRowsHTML()}</div>
    <div style="margin-top:10px"><button class="btn small primary" id="addLogin">+ Add a login</button></div>
    <p class="hint" style="margin:10px 0 0">Staff can create and edit documents. Only admins can delete documents, change settings and manage logins.</p></section>`;
}
function teamRowsHTML(){
  if(TEAM===null) return '<span class="hint">Loading…</span>';
  return (TEAM||[]).map(m=>`<div class="teamrow"><div class="who"><b>${esc(m.name||m.email)}</b><span>${esc(m.email)}</span></div>
    <span class="tag">${m.role==='admin'?'Admin':'Staff'}</span>
    ${m.user_id===ME.id?'<span class="hint">You</span>':`<button class="btn small" data-tpw="${esc(m.user_id)}">Set new password</button>
    <button class="btn small" data-trole="${esc(m.user_id)}" data-to="${m.role==='admin'?'staff':'admin'}">${m.role==='admin'?'Make staff':'Make admin'}</button>
    <button class="btn small danger" data-trm="${esc(m.user_id)}">Remove</button>`}</div>`).join('');
}
async function loadTeam(){
  const { data, error } = await sb.from('isell_members').select('user_id,email,name,role').order('created_at');
  TEAM = error ? [] : data;
  const t=$('#team'); if(t) t.innerHTML = teamRowsHTML();
}
function staffHTML(){
  return (SD.staff||[]).map((s,i)=>`<div class="staffrow">
    <div class="f"><label for="sn_${i}">Name</label><input id="sn_${i}" data-staff="${i}" data-sf="name" value="${esc(s.name)}"></div>
    <div class="f"><label for="sr_${i}">Job title</label><input id="sr_${i}" data-staff="${i}" data-sf="role" value="${esc(s.role||'')}" placeholder="e.g. Sales"></div>
    <div class="f"><label>Signature</label><div class="sigbox">${s.signature?`<img src="${esc(s.signature)}" alt="Signature of ${esc(s.name)}">`:'<span class="hint">No signature yet</span>'}</div></div>
    <div class="sigbtns"><button class="btn small" data-draw="${i}">Draw</button><label class="btn small" for="up_${i}">Upload</label><input id="up_${i}" type="file" accept="image/*" data-up="${i}" hidden>${s.signature?`<button class="btn small" data-clrsig="${i}">Clear</button>`:''}${(SD.staff.length>1)?`<button class="btn small danger" data-rmstaff="${i}">Remove</button>`:''}</div>
  </div>`).join('');
}
document.addEventListener('input', e=>{
  if(S.view!=='settings'||!SD) return; const t=e.target;
  if(t.dataset.path && t.dataset.path.startsWith('S.')) setPath(SD, t.dataset.path.slice(2), t.dataset.num ? n2(t.value) : t.value);
  if(t.dataset.staff!==undefined) SD.staff[+t.dataset.staff][t.dataset.sf]=t.value;
});
document.addEventListener('change', async e=>{
  if(S.view!=='settings'||!SD) return; const t=e.target;
  if(t.dataset.up!==undefined && t.files && t.files[0]){ try{ SD.staff[+t.dataset.up].signature = await fitImage(t.files[0]); $('#staff').innerHTML=staffHTML(); }catch(err){ toast('Could not read that image.'); } }
});
document.addEventListener('click', async e=>{
  if(S.view!=='settings'||!SD) return; const b=e.target.closest('button'); if(!b) return; if(b.closest('form')) return;
  if(b.id==='addStaff'){ SD.staff.push({id:uid(),name:'',role:'',signature:''}); $('#staff').innerHTML=staffHTML(); }
  if(b.dataset.rmstaff!==undefined){ SD.staff.splice(+b.dataset.rmstaff,1); $('#staff').innerHTML=staffHTML(); }
  if(b.dataset.clrsig!==undefined){ SD.staff[+b.dataset.clrsig].signature=''; $('#staff').innerHTML=staffHTML(); }
  if(b.dataset.draw!==undefined) openPad(+b.dataset.draw);
  if(b.id==='changePw'){
    const p1=$('#my_pw').value, p2=$('#my_pw2').value;
    if(p1.length<8){ toast('The password must be at least 8 characters.'); return; }
    if(p1!==p2){ toast('The two passwords are not the same.'); return; }
    b.disabled=true; const { error } = await sb.auth.updateUser({ password:p1 }); b.disabled=false;
    if(error){ toast(/same|different/i.test(error.message)?'That is already your password.':'Not changed: '+netMsg(error)); return; }
    $('#my_pw').value=''; $('#my_pw2').value=''; toast('Your password has been changed.'); return;
  }
  if(b.id==='addLogin'){ return openAddLogin(); }
  if(b.dataset.tpw){ return openSetPw(b.dataset.tpw); }
  if(b.dataset.trole){ const m=TEAM.find(x=>x.user_id===b.dataset.trole); return confirmBox(`${b.dataset.to==='admin'?'Make':'Change'} ${m.name||m.email} ${b.dataset.to==='admin'?'an admin':'to staff'}?`, b.dataset.to==='admin'?'Admins can delete documents, change settings and manage logins.':'They will still be able to create and edit documents.', 'Yes, change', async()=>{ try{ await adminCall({action:'set_role', user_id:m.user_id, role:b.dataset.to}); toast('Updated'); TEAM=null; loadTeam(); }catch(err){ toast(err.message); } }); }
  if(b.dataset.trm){ const m=TEAM.find(x=>x.user_id===b.dataset.trm); return confirmBox(`Remove ${m.name||m.email}?`, 'They will not be able to sign in to iSell Billing any more. Documents they made stay.', 'Remove', async()=>{ try{ await adminCall({action:'remove_staff', user_id:m.user_id}); toast('Removed'); TEAM=null; loadTeam(); }catch(err){ toast(err.message); } }); }
  if(b.id==='doBackup'){
    const data = { app:'iSell Billing', exportedAt:new Date().toISOString(), settings:S.settings, docs:S.docs };
    await saveFile(`iSell backup ${todayISO()}.json`, new Blob([JSON.stringify(data,null,1)], {type:'application/json'})); return;
  }
  if(b.id==='saveSet'){
    SD.staff=SD.staff.filter(s=>String(s.name).trim()); if(!SD.staff.length){ toast('Add at least one staff member.'); return; }
    b.disabled=true; b.textContent='Saving…';
    try{ await storeSaveSettings(SD); toast('Settings saved'); render(); }catch(err){ toast(writeErr(err)); b.disabled=false; b.textContent='Save settings'; }
  }
});
function openAddLogin(){
  showModal(`<h3>Add a login</h3><p>Choose a starting password and give it to them in person or on WhatsApp. They can change it in Settings after signing in.</p>
    <form id="alForm" novalidate><div class="grid2">
      <div class="f full"><label for="al_name">Name</label><input id="al_name" autocomplete="off" required></div>
      <div class="f full"><label for="al_email">Email</label><input id="al_email" type="email" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="off" required></div>
      <div class="f full"><label for="al_pw">Starting password (8 or more characters)</label><input id="al_pw" type="text" autocomplete="off" spellcheck="false" required minlength="8"></div>
      <div class="f full"><label for="al_role">Access</label><select id="al_role"><option value="staff">Staff: create and edit documents</option><option value="admin">Admin: everything, including settings and logins</option></select></div>
    </div><p class="err-line" id="al_err" role="alert" style="color:var(--bad);font-weight:600;margin:10px 0 0"></p>
    <div class="row" style="margin-top:12px"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Add login</button></div></form>`);
  $('#al_name').focus();
  $('#alForm').onsubmit = async ev=>{
    ev.preventDefault(); const b=ev.target.querySelector('button[type=submit]'), err=$('#al_err');
    const v={ name:$('#al_name').value.trim(), email:$('#al_email').value.trim().toLowerCase(), password:$('#al_pw').value, role:$('#al_role').value };
    if(!v.name||!v.email){ err.textContent='Please enter their name and email.'; return; }
    if(v.password.length<8){ err.textContent='The password must be at least 8 characters.'; return; }
    b.disabled=true; b.textContent='Adding…';
    try{ const r=await adminCall({action:'add_staff', ...v}); closeModal(); toast(r.existed?`${v.name} already had an account: they sign in with their existing password.`:`${v.name} can now sign in.`); TEAM=null; loadTeam(); }
    catch(e){ err.textContent=netMsg(e); b.disabled=false; b.textContent='Add login'; }
  };
}
function openSetPw(id){
  const m=TEAM.find(x=>x.user_id===id);
  showModal(`<h3>New password for ${esc(m.name||m.email)}</h3><p>Give them the new password. They can change it in Settings after signing in.</p>
    <form id="spForm" novalidate><div class="f"><label for="sp_pw">New password (8 or more characters)</label><input id="sp_pw" type="text" autocomplete="off" spellcheck="false" minlength="8" required></div>
    <p id="sp_err" role="alert" style="color:var(--bad);font-weight:600;margin:10px 0 0"></p>
    <div class="row" style="margin-top:12px"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Set password</button></div></form>`);
  $('#sp_pw').focus();
  $('#spForm').onsubmit = async ev=>{
    ev.preventDefault(); const p=$('#sp_pw').value; if(p.length<8){ $('#sp_err').textContent='The password must be at least 8 characters.'; return; }
    const b=ev.target.querySelector('button[type=submit]'); b.disabled=true;
    try{ await adminCall({action:'set_password', user_id:id, password:p}); closeModal(); toast('Password changed.'); }
    catch(e){ $('#sp_err').textContent=netMsg(e); b.disabled=false; }
  };
}
function fitImage(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1, 600/im.width, 200/im.height); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/png')); }; im.onerror=rej; im.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); });
}
function openPad(i){
  showModal(`<h3>Draw your signature</h3><p>Use your finger or mouse inside the box.</p><canvas class="pad" id="pad"></canvas><div class="row"><button class="btn" id="padClear">Start again</button><button class="btn" data-close>Cancel</button><button class="btn primary" id="padSave">Use this signature</button></div>`);
  const cv=$('#pad'), r=cv.getBoundingClientRect(), dpr=2; cv.width=r.width*dpr; cv.height=r.height*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.6; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#1c1433';
  let drawing=false, drew=false;
  const pos=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  cv.onpointerdown=e=>{ drawing=true; cv.setPointerCapture(e.pointerId); const [a,b]=pos(e); x.beginPath(); x.moveTo(a,b); };
  cv.onpointermove=e=>{ if(!drawing) return; const [a,b]=pos(e); x.lineTo(a,b); x.stroke(); drew=true; };
  cv.onpointerup=()=>{ drawing=false; };
  $('#padClear').onclick=()=>{ x.clearRect(0,0,cv.width,cv.height); drew=false; };
  $('#padSave').onclick=()=>{ if(!drew){ toast('Draw your signature first.'); return; } SD.staff[i].signature=trimCanvas(cv); closeModal(); $('#staff').innerHTML=staffHTML(); toast('Signature added. Press Save settings to keep it.'); };
}
function trimCanvas(cv){
  const x=cv.getContext('2d'), {width:w,height:h}=cv, d=x.getImageData(0,0,w,h).data; let t=h,l=w,r=0,b=0;
  for(let y=0;y<h;y++) for(let i=0;i<w;i++){ if(d[(y*w+i)*4+3]>10){ if(y<t)t=y; if(y>b)b=y; if(i<l)l=i; if(i>r)r=i; } }
  const pad=10; l=Math.max(0,l-pad); t=Math.max(0,t-pad); r=Math.min(w,r+pad); b=Math.min(h,b+pad);
  const s=Math.min(1, 600/(r-l), 200/(b-t)); const c=document.createElement('canvas'); c.width=Math.round((r-l)*s); c.height=Math.round((b-t)*s);
  c.getContext('2d').drawImage(cv,l,t,r-l,b-t,0,0,c.width,c.height); return c.toDataURL('image/png');
}

window.addEventListener('beforeunload', e=>{ if(S.view==='edit' && S.E && ME.role){ e.preventDefault(); e.returnValue=''; } });
if(window.top !== window.self){ document.body.textContent = 'For your safety, open iSell Billing directly in its own browser tab.'; throw new Error('framed'); }
/* ---------------- start ---------------- */
boot();
